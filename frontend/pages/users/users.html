
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários - Sistema de Controle de Manutenção</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/forms.css">
</head>
<body>
  <div class="d-flex min-vh-100">

    <aside class="bg-dark text-white p-3 flex-shrink-0" style="width: 250px;">
      <h5 class="mb-4">Manutenção</h5>
      <ul class="nav flex-column">
        <li class="nav-item mb-1"><a href="../dashboard/dashboard.html" class="nav-link text-white">Dashboard</a></li>
        <li class="nav-item mb-1"><a href="../equipments/equipments.html" class="nav-link text-white">Equipamentos</a></li>
        <li class="nav-item mb-1"><a href="../categories/categories.html" class="nav-link text-white">Categorias</a></li>
        <li class="nav-item mb-1"><a href="../locations/locations.html" class="nav-link text-white">Locais</a></li>
        <li class="nav-item mb-1"><a href="../technicians/technicians.html" class="nav-link text-white">Técnicos</a></li>
        <li class="nav-item mb-1"><a href="../work-orders/work-orders.html" class="nav-link text-white">Ordens de Serviço</a></li>
        <li class="nav-item mb-1"><a href="../history/history.html" class="nav-link text-white">Histórico</a></li>
        <li class="nav-item mb-1"><a href="../users/users.html" class="nav-link text-white active bg-primary">Usuários</a></li>
      </ul>
    </aside>

    <main class="flex-grow-1 bg-light p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Usuários</h4>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal">Novo usuário</button>
      </div>
      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th class="text-end">Ações</th></tr>
            </thead>
            <tbody>
            <tr><td>Usuário Exemplo</td><td>admin@exemplo.com</td><td>Administrador</td><td><span class="badge text-bg-success">Ativo</span></td><td class="text-end"><button type="button" class="btn btn-sm btn-outline-primary me-1">Editar</button><button type="button" class="btn btn-sm btn-outline-danger">Excluir</button></td></tr>
            <tr><td>Outro Exemplo</td><td>tecnico@exemplo.com</td><td>Técnico</td><td><span class="badge text-bg-success">Ativo</span></td><td class="text-end"><button type="button" class="btn btn-sm btn-outline-primary me-1">Editar</button><button type="button" class="btn btn-sm btn-outline-danger">Excluir</button></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

  </div>

  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form>
          <div class="modal-header">
            <h5 class="modal-title" id="userModalLabel">Novo usuário</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="userName" class="form-label">Nome completo</label>
                <input type="text" class="form-control" id="userName" name="userName" required>
              </div>
              <div class="col-md-6">
                <label for="userEmail" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="userEmail" name="userEmail" required>
              </div>
              <div class="col-md-6">
                <label for="userRole" class="form-label">Perfil</label>
                <select class="form-select" id="userRole" name="userRole" ><option value="tecnico">Técnico</option><option value="admin">Administrador</option></select>
              </div>
              <div class="col-md-6">
                <label for="userStatus" class="form-label">Status</label>
                <select class="form-select" id="userStatus" name="userStatus" ><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-success">Salvar usuário</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
